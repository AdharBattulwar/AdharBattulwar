name: Generate Snake Game from Contribution Grid

# Trigger on push, pull request, or manual workflow dispatch
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  generate-snake-game:
    name: Generate Snake Game
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Snake Game
        uses: Platane/snk@v3.3.0
        with:
          github_user_name: ${{ adharbattulwar }}
